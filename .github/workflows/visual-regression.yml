name: Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  visual-regression:
    name: Screenshot Comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        run: cd src-tauri && cargo build --release

      - name: Install Playwright
        run: |
          npm install -g @playwright/test
          npx playwright install-deps chromium

      - name: Run visual regression tests
        run: |
          cd tests/visual
          npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: playwright-report
          path: tests/visual/playwright-report/

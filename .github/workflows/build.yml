name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build
        run: cd src-tauri && cargo build --verbose

      - name: Test
        run: cd src-tauri && cargo test --all-targets --verbose

      - name: Run benchmarks
        run: cd src-tauri && cargo test --test m7_buffer_bench -- --nocapture > ../benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark-results.txt

  test-wasm:
    name: WASM Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: wasm

      - name: Test WASM crate
        run: cd wasm && cargo test

      - name: Build WASM module
        run: cd wasm && cargo build --target wasm32-unknown-unknown --release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Format check
        run: cd src-tauri && cargo fmt -- --check

      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cd src-tauri && cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny
        run: cd src-tauri && cargo deny check

  fuzz:
    name: cargo fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        run: |
          cd src-tauri
          cargo +nightly fuzz build fuzz_apply_change
          cargo +nightly fuzz build fuzz_tokenize
          cargo +nightly fuzz build fuzz_compute_line_delta

  build-tauri-linux-x86_64:
    name: Build Tauri App (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Tauri
        run: cd src-tauri && cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: tauri-linux-x86_64
          path: src-tauri/target/release/monaco-tauri*

  build-tauri-linux-aarch64:
    name: Build Tauri App (Linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install cross-compilation linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Tauri (cross-compile aarch64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cd src-tauri && cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: tauri-linux-aarch64
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/monaco-tauri*

  build-tauri-macos-x86_64:
    name: Build Tauri App (macOS x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Tauri
        run: cd src-tauri && cargo build --release --target x86_64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: tauri-macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/monaco-tauri*

  build-tauri-macos-aarch64:
    name: Build Tauri App (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Tauri
        run: cd src-tauri && cargo build --release --target aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: tauri-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/monaco-tauri*

  build-tauri-windows-x86_64:
    name: Build Tauri App (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Tauri
        shell: pwsh
        run: cd src-tauri; cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: tauri-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/monaco-tauri*

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: build-tauri-linux-x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          node-version: 20

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Install tauri-driver
        uses: taiki-e/cache-cargo-install-action@417450f3c33ee20393705369577571770643d4c7 # v3
        with:
          tool: tauri-driver

      - name: Build Tauri App
        run: cd src-tauri && cargo build --release

      - name: Run Visual Regression Tests
        run: xvfb-run npx playwright test tests/visual/
        env:
          CI: true

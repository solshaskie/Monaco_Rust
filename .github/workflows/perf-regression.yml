name: Performance Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  perf-regression:
    name: Benchmark & Compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Run benchmarks
        run: cd src-tauri && cargo test --test m7_buffer_bench -- --nocapture > ../benchmark-results.txt

      - name: Download baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-baseline
          path: baseline/
        continue-on-error: true

      - name: Compare against baseline
        run: |
          echo "Current benchmark results:"
          cat benchmark-results.txt
          if [ -f baseline/benchmark-results.txt ]; then
            echo ""
            echo "Baseline results:"
            cat baseline/benchmark-results.txt
            echo ""
            echo "Comparison:"
            python3 .github/scripts/compare_benchmarks.py benchmark-results.txt baseline/benchmark-results.txt
          else
            echo "No baseline found; storing as new baseline."
          fi

      - name: Upload results as new baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: benchmark-baseline
          path: benchmark-results.txt
          overwrite: true

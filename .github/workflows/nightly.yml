name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  nightly:
    name: Build and Sign Nightly Artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-nightly-linux-x86_64
          - platform: macos-13
            target: x86_64-apple-darwin
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-nightly-macos-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-nightly-macos-aarch64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: monaco-tauri.exe
            asset_name: monaco-tauri-nightly-windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Release
        run: cd src-tauri && cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ../../../${{ matrix.asset_name }}.zip
          cd ../../..

      - name: Sign artifact (GPG)
        if: runner.os != 'Windows'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --yes --import
            gpg --batch --yes --detach-sign --armor ${{ matrix.asset_name }}.tar.gz
          fi

      - name: Upload nightly artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.asc

      - name: Upload nightly artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip

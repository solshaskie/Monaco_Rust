name: Nightly Release

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  nightly:
    name: Build and Sign Nightly Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Build Release
        run: cd src-tauri && cargo build --release

      - name: Package
        run: |
          cd src-tauri/target/release
          tar czf ../../../monaco-tauri-nightly-linux-x86_64.tar.gz monaco-tauri
          cd ../../..

      - name: Sign artifact (GPG)
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --yes --import
            gpg --batch --yes --detach-sign --armor monaco-tauri-nightly-linux-x86_64.tar.gz
          fi

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: monaco-tauri-nightly-linux-x86_64
          path: |
            monaco-tauri-nightly-linux-x86_64.tar.gz
            monaco-tauri-nightly-linux-x86_64.tar.gz.asc

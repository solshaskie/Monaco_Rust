name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-linux-x86_64
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-linux-aarch64
          - platform: macos-13
            target: x86_64-apple-darwin
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-macos-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: monaco-tauri
            asset_name: monaco-tauri-macos-aarch64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: monaco-tauri.exe
            asset_name: monaco-tauri-windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Build Release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cd src-tauri && cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd src-tauri/target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ../../../${{ matrix.asset_name }}.zip
          cd ../../..

      - name: Sign artifact (GPG)
        if: runner.os != 'Windows'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --yes --import
            gpg --batch --yes --detach-sign --armor ${{ matrix.asset_name }}.tar.gz
          fi

      - name: Create release (idempotent)
        if: matrix.platform == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" --title "Release $VERSION" --generate-notes --draft || true

      - name: Upload release asset (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}.tar.gz" --clobber
          if [ -f "${{ matrix.asset_name }}.tar.gz.asc" ]; then
            gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}.tar.gz.asc" --clobber
          fi

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}.zip" --clobber

  publish-crates:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@49933ea5288caeca8642d1e84afbd3f7d6820020 # v3

      - name: Verify publishable
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cd src-tauri && cargo publish --dry-run
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"
          fi

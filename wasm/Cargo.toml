[package]
name = "monaco-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# We compile a subset of tokenization logic for WASM.
# Full tree-sitter is not wasm32-friendly; we use a lightweight regex tokenizer here.
# In production, web-tree-sitter (JS) or compiled grammar WASM modules would be used.

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true

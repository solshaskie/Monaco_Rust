[package]
name = "monaco-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
console_error_panic_hook = { version = "0.1", optional = true }

# ---------------------------------------------------------------------------
# B.7 — web-tree-sitter parity
# ---------------------------------------------------------------------------
# `tree-sitter` and the language crates are pure-Rust and `wasm32-unknown-unknown`
# friendly. They are the same versions the native Rust backend uses
# (`src-tauri/Cargo.toml`), so the WASM tokenizer and the native tokenizer
# produce byte-identical token streams for identical input.
#
# This is the "compiled grammar WASM modules" path that was deferred in the
# original WASM roadmap. We avoid the JS-only `web-tree-sitter` package because
# it pulls grammar WASM blobs over the network at runtime, breaking offline
# operation and determinism.
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
